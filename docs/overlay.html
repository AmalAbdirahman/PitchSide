<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PitchSide program output</title>
<!-- Program output (P13): a transparent 1920x1080 page with only the score bug and the on-air
     graphic, driven by the control room (index.html) over a BroadcastChannel. Synthetic match;
     no crests, logos or broadcaster branding. -->
<style>
  :root {
    --k: 1;
    --home: #38BDF8; --away: #F472B6;  /* team tokens, as --air-home and --air-away in styles.css */
    --ink: #f5f5f5; --muted: #b3b3b3; --panel: rgba(29, 29, 29, 0.94); --panel2: rgba(38, 38, 38, 0.96); --accent: #00c26e;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body.backdrop { background: repeating-linear-gradient(90deg, #17261c 0 10%, #1a2b20 10% 20%); }
  .stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform: scale(var(--k)); transform-origin: 0 0;
    font-family: var(--font); color: var(--ink);
  }
  #hint {
    position: absolute; right: 48px; top: 48px; max-width: 560px; margin: 0; padding: 14px 18px;
    background: var(--panel); border-radius: 16px; font-size: 22px; color: var(--muted);
  }

  /* score bug */
  #bug {
    position: absolute; left: 64px; top: 48px; display: flex; align-items: stretch; height: 56px;
    font-size: 30px; font-weight: 700; border-radius: 14px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  #bug > span { display: flex; align-items: center; padding: 0 18px; background: var(--panel); }
  #bug .team i { width: 14px; height: 14px; border-radius: 50%; margin-right: 12px; }
  #bug .team.away i { margin: 0 0 0 12px; }
  #bug .home i { background: var(--home); }
  #bug .away i { background: var(--away); }
  #bug .score { background: var(--ink); color: #121212; padding: 0 22px; font-variant-numeric: tabular-nums; }
  #bug .min { background: var(--panel2); color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* graphics */
  .g { position: absolute; animation: in .45s ease-out both; }
  @keyframes in { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  .home { --side: var(--home); } .away { --side: var(--away); }

  .g-lower { left: 96px; bottom: 96px; display: flex; align-items: stretch; max-width: 1500px; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  .g-lower .label {
    display: flex; align-items: center; padding: 0 26px; background: var(--side, var(--ink)); color: #121212;
    font-size: 26px; font-weight: 700; white-space: nowrap;
  }
  .g-lower .text { padding: 22px 30px; background: var(--panel); font-size: 34px; line-height: 1.25; }

  .g-ticker { left: 0; right: 0; bottom: 0; height: 68px; display: flex; align-items: center; background: var(--panel); border-top: 4px solid var(--accent); }
  .g-ticker span { padding-left: 64px; font-size: 30px; white-space: nowrap; }

  .g-compare { left: 50%; bottom: 80px; width: 960px; margin-left: -480px; padding: 26px 34px 22px; background: var(--panel); border-radius: 20px; border-top: 6px solid var(--side, var(--ink)); box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  .g-compare .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .g-compare .head b { font-size: 32px; } .g-compare .head span { font-size: 24px; color: var(--muted); }
  .g-compare .row { display: grid; grid-template-columns: 250px 1fr 130px; align-items: center; gap: 18px; height: 54px; font-size: 30px; }
  .g-compare .row .name { color: var(--muted); } .g-compare .row.subject .name { color: var(--ink); font-weight: 700; }
  .g-compare .bar { height: 18px; background: rgba(255,255,255,.12); border-radius: 9px; overflow: hidden; }
  .g-compare .bar span { display: block; height: 100%; border-radius: 9px; }
  .g-compare .row.home .bar span { background: var(--home); } .g-compare .row.away .bar span { background: var(--away); }
  .g-compare .val { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .g .line { margin: 14px 0 0; font-size: 24px; line-height: 1.3; color: var(--muted); }

  .g-player { left: 96px; top: 300px; width: 600px; display: flex; background: var(--panel); border-radius: 20px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  .g-player .stripe { width: 14px; background: var(--side, var(--ink)); }
  .g-player .body { padding: 28px 34px 30px; }
  .g-player p { margin: 0; }
  .g-player .team { font-size: 24px; color: var(--muted); }
  .g-player .name { font-size: 46px; font-weight: 800; margin-top: 4px; }
  .g-player .figure { font-size: 96px; font-weight: 800; line-height: 1.05; margin-top: 18px; color: var(--side, var(--ink)); font-variant-numeric: tabular-nums; }
  .g-player .label { font-size: 26px; color: var(--ink); margin-top: 6px; }

  @media (prefers-reduced-motion: reduce) { .g { animation: none; } }
</style>
</head>
<body>
<main class="stage" aria-label="Program output: score bug and on-air graphic">
  <p id="hint">Program output. Waiting for the control room: open <b>index.html</b> from the same site in this browser and press play.</p>
  <div id="bug" hidden></div>
  <div id="graphic" aria-live="polite"></div>
</main>
<script type="module" src="js/overlay.js"></script>
</body>
</html>
