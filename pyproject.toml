[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchside"
version = "0.1.0"
description = "A broadcast control room for football match insights where deterministic code decides truth."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# Runtime: the offline build, the tests and the eval need only these three.
dependencies = ["jsonschema>=4", "pydantic>=2.11", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-jsonschema", "types-PyYAML", "pre-commit"]
data = ["pandas", "scipy", "scikit-learn", "kloppy", "statsbombpy", "matplotlib"]
# Only for `python -m app.build_bundle --foundry` and scripts/foundry_smoke.py.
# brotli carried over from requirements-foundry.txt (added with the Scout agent, commit 100c01c).
agents = ["azure-ai-projects>=2.3.0", "azure-identity", "python-dotenv", "brotli>=1.2"]

[tool.setuptools]
packages = ["app", "core", "sim"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["design", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter owns line length for code. What it cannot wrap (prompt text, Spanish templates,
# docstrings, data-card strings) is left long rather than split into concatenated literals.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["core", "app"]
strict = true

[[tool.mypy.overrides]]
module = ["azure.*", "dotenv"]
ignore_missing_imports = true
