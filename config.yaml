# Tunable defaults, not validated values (SPEC.md).

seed: 7

pitch:
  length: 105
  width: 68
  own_third_x: 35
  final_third_x: 70

sim:
  hero_match_id: nb_v_hr_hero
  league_matches: 50
  half_s: 2700
  mean_gap_s: 13
  lane_weights: [0.36, 0.28, 0.36]
  overload_lane_weights: [0.75, 0.10, 0.15]
  pass_logit_intercept: -3.0
  pass_logit_dist: 0.07
  pass_logit_pressure: 1.2
  pass_logit_final_third: 0.8
  press_logit_boost: 1.0
  pressure_prob: 0.25
  press_pressure_prob: 0.7
  tackle_prob: 0.12
  card_prob: 0.05
  shot_prob_box: 0.45
  shot_prob_long: 0.06
  hero_sub_t: 3445
  hero_goal_t: 3748
  hero_overload_until_t: 4500
  hero_press_from_t: 3900
  hero_away_sub_t: 4230

# xG = logistic(intercept + dist * metres + angle * radians + header + other_body + free_kick
# + under_pressure); a penalty is `penalty`. Fitted by scripts/fit_xg.py on StatsBomb Open Data
# (men's World Cups 2018 and 2022, Euros 2020 and 2024; 4203 open-play shots from 172 train
# matches, 61 penalties), run 2026-11-13 at commit 1a949f7. Full record with standard errors and
# the test-set validation: data/xg_fit.json; method: docs/methods/xg.md.
xg:
  intercept: -1.6029
  dist: -0.0959
  angle: 1.7831
  header: -1.22
  other_body: -1.7899
  free_kick: 0.3857
  under_pressure: -0.5047
  penalty: 0.6557
  # Laws of the Game.
  goal_width: 7.32

winprob:
  k: 20
  goal_cap: 10
  match_minutes: 90

# Win-probability validation (P10, scripts/eval_winprob.py, docs/methods/winprob.md). Game states
# every every_min official minutes before 90; phases bucket the calibration tables. Real matches
# are the xg_fit seasons with the same train/test split; simulated matches use their own seeds.
# poisson_v2 picks k and rho from these grids by training Brier score (grids chosen by hand;
# k 100000 all but ignores in-game xG). Bootstrap resamples whole matches.
winprob_eval:
  every_min: 5
  phases: [0, 30, 60, 90]
  sim_seed: 300000
  sim_train_matches: 300
  sim_test_matches: 300
  k_grid: [10, 20, 40, 80, 160, 320, 640, 1280, 100000]
  rho_grid: [-0.1, -0.05, 0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3]
  bootstrap: 1000
  bootstrap_seed: 7

moments:
  check_every_s: 300
  first_check_s: 600
  overload_window_s: 900
  overload_min_share: 0.5
  turnover_window_s: 600
  turnover_min_count: 3
  # Least xT a player must add in a half for the xT moment; chosen by hand (P8).
  xt_leader_min: 0.1
  # Least linked passes a team needs in a half before its most central player is named (P10;
  # chosen by hand: a smaller network ranks players on a handful of passes).
  hub_min_passes: 20
  # R3. Length of the fixed match intervals for npxG by interval (core/intervals.py); 15 minutes
  # is the usual broadcast split, chosen by hand.
  interval_minutes: 15
  # Least npxG a team must build in one interval before the moment fires; chosen by hand (about
  # one good chance; on the seed-7 match it names 3 of the 12 team intervals).
  npxg_interval_min: 0.3
  # Least shots a team needs in a half before its shots on target are stated; chosen by hand so
  # the claim is not about one or two shots.
  shot_outcomes_min_shots: 5

# Chart and KPI series in hero.json (app/series.py).
series:
  # Field tilt is shown over a trailing window, as broadcasts usually quote it; 15 minutes is
  # chosen by hand to match the attack-lane window above.
  tilt_window_s: 900

verifier:
  n_min: 6
  z: 1.96
  tol_share_pp: 0.5
  tol_xg: 0.01
  tol_speed: 0.5
  # xT added is stated to two decimals; chosen by hand like tol_xg.
  tol_xt: 0.01
  # Player names in the text: a capitalised word within name_max_edits letter edits of a roster
  # surname (and not equal to one) is a misspelt name and rejects the claim. Only surnames of at
  # least name_min_length letters are compared, so short common words do not trigger it.
  # Chosen by hand; on the committed texts (179 sentences) it raises no false alarms.
  name_max_edits: 1
  name_min_length: 5
  early_markers:
    - 'early sign'
    - 'so far'
  suggest_markers:
    - 'suggest'
    - 'looks like'
  intent_patterns:
    - ',?\s+(as|because) (he|she|they) (tried|wanted|decided) to [^.;]*'
    - '\s*\bdeliberately\b'
    - '\b(tried|wanted|decided) to\s+'

# Beta-Binomial hedge for lane-share claims (P9, core/hedge.py). Prior: Beta centred on the league's
# share for the lane, worth prior_strength attacks; counts are divided by the league's variance
# inflation (clustered). "clear" needs P(share > league share + min_effect) >= clear_prob.
# Chosen from the false-alarm study (scripts/eval_hedging.py, run 2026-11-13 at da95a22;
# docs/methods/hedging.md): 0.11 false "clear" calls per null match, against 6.3 for the old rule.
hedge:
  prior_strength: 10
  clear_prob: 0.95
  min_effect: 0.0
  clustered: true

# P9 false-alarm study (scripts/eval_hedging.py): simulated matches with no planted overload, and
# with the hero script's overload (seeds far from the league's 7000-7049). Candidate Beta rules,
# all with hedge.prior_strength; the Wilson rule in the product is always measured too.
# clear_prob 0.997 is 1 - 0.05 / 17: a Bonferroni split of 5% over the 17 checkpoints per match.
hedge_eval:
  null_matches: 300
  planted_matches: 300
  null_seed: 100000
  planted_seed: 200000
  # The rule before P9, kept for the study: a 95% Wilson interval against a fixed 1/3 baseline.
  wilson_baseline: 0.3333333
  # A second, stronger planted overload (chosen by hand): 90% of the home side's possessions
  # aim down the left from its substitution to full time, instead of the hero script's
  # sim.overload_lane_weights until sim.hero_overload_until_t.
  strong_lane_weights: [0.90, 0.05, 0.05]
  strong_until_t: 5400
  candidates:
    - {name: beta, prior_strength: 10, clear_prob: 0.95, min_effect: 0.0, clustered: false}
    - {name: beta_effect, prior_strength: 10, clear_prob: 0.95, min_effect: 0.1, clustered: false}
    - {name: beta_bonferroni, prior_strength: 10, clear_prob: 0.997, min_effect: 0.0, clustered: false}
    - {name: beta_effect_bonferroni, prior_strength: 10, clear_prob: 0.997, min_effect: 0.1, clustered: false}
    - {name: clustered, prior_strength: 10, clear_prob: 0.95, min_effect: 0.0, clustered: true}
    - {name: clustered_effect, prior_strength: 10, clear_prob: 0.95, min_effect: 0.1, clustered: true}
    - {name: clustered_bonferroni, prior_strength: 10, clear_prob: 0.997, min_effect: 0.0, clustered: true}
    - {name: clustered_90, prior_strength: 10, clear_prob: 0.90, min_effect: 0.0, clustered: true}
    - {name: clustered_light_prior, prior_strength: 3, clear_prob: 0.95, min_effect: 0.0, clustered: true}
    - {name: clustered_light_prior_bonferroni, prior_strength: 3, clear_prob: 0.997, min_effect: 0.0, clustered: true}

router:
  veto_window_s: 3
  t2_ttl_s: 12
  impact_t2: 0.10
  t0_metrics: [goals, substitutions, cards]
  negative_metrics: [turnovers_own_third, duels_lost]
  negative_words: [lost, error, mistake, poor]

renditions:
  cue_duration_s: 6
  ticker_duration_s: 8
  ticker_metrics: [xg_sum, pass_accuracy, top_shot_speed, shots]
  # P13 graphics, chosen by hand. A team claim on a comparison metric shows both teams side by
  # side; a player claim on a player-card metric gets a player card. Both win over the ticker.
  card_duration_s: 8
  # R3: npxG by interval and shots on target compare both teams over the same window.
  comparison_metrics: [xg_sum, pass_accuracy, npxg_sum, shots_on_target]
  player_card_metrics: [shots, xt_added, most_central_player]

data_card:
  goals_per_match: [1.8, 3.5]
  shots_per_team: [7, 18]
  xg_per_shot: [0.07, 0.16]
  pass_completion: [0.70, 0.90]
  hero_events: [550, 650]

# Build-time Scout agent on Microsoft Foundry (SPEC section 19). Only used with --foundry.
# The Scout (P11). mode: what the site's build uses, handed (the moment's numbers are given) or
# explore (the Scout finds them with read-only tools). Budgets count model responses per build;
# max_tool_rounds caps one conversation; max_events caps a list_events answer; memory_size is how many
# aired facts each request carries. All chosen by hand.
agents:
  scout_name: pitchside-scout
  # P12: the Reader reads each Scout sentence back into a claim (app/reader.py).
  reader_name: pitchside-reader
  mode: handed
  max_calls: 100
  explore_max_calls: 400
  max_tool_rounds: 8
  max_events: 40
  memory_size: 6
  timeout_s: 60
  # Chosen by hand: one read per Scout draft (38 moments, each drafted at most twice) plus the
  # 60+ labelled sentences of scripts/eval_meaning.py, with room to spare.
  reader_max_calls: 200

# StatsBomb Open Data (P6). Raw files are downloaded into data/external/ (git-ignored) by
# scripts/fetch_statsbomb.py and never committed. Licence: StatsBomb Public Data User Agreement.
statsbomb:
  base_url: "https://raw.githubusercontent.com/statsbomb/open-data/master/data"
  # Chosen by hand: the 2018 FIFA World Cup final. Competition and season ids are StatsBomb's.
  competition_id: 43
  season_id: 3
  match_id: 8658
  # Other matches of the same season used for the league xG rate (mu), chosen by hand.
  # The replayed match is excluded so its own shots do not set its prior.
  mu_matches: 10
  # StatsBomb pitch units, from the StatsBomb event data specification.
  source_length: 120
  source_width: 80
  # xG on real shots: "statsbomb" uses StatsBomb's own statsbomb_xg (better on held-out matches,
  # docs/methods/xg.md); "ours" uses core/xg.py's fitted model. Chosen by hand. A shot without
  # statsbomb_xg falls back to ours. The simulator always uses ours.
  shot_xg: statsbomb

# xG fit (P7): scripts/fit_xg.py fits core/xg.py's model on these StatsBomb Open Data seasons
# (competition id, season id): men's World Cups 2018 and 2022, Euros 2020 and 2024. Chosen by hand:
# recent, complete tournaments tagged the same way. Raw files stay in data/external/ (git-ignored).
xg_fit:
  seasons: [[43, 3], [43, 106], [55, 43], [55, 282]]
  # Whole matches go to the test set, never single shots, so no match is in both sets.
  test_fraction: 0.25
  split_seed: 7
  reliability_bins: 10
  max_iter: 50
  # Tiny L2 penalty that only keeps the Newton steps well posed; chosen by hand.
  ridge: 1.0e-6

