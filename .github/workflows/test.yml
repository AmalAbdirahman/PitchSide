name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Core dependencies only. The Foundry packages are build-time extras and must not be needed here.
      - run: python -m pip install pytest jsonschema
      - run: pytest -q
